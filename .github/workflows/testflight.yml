name: TestFlight
on:
  push:
    branches: [main]
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: flutter pub get
      - name: Import signing certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          # Sign with a fixed, pre-created distribution cert imported into a
          # throwaway keychain. This stops Xcode from minting — and, at the
          # 2-cert cap, revoking — the shared distribution cert, which is what
          # expired every app's TestFlight builds on 2026-07-23. With the cert
          # present, automatic signing reuses it instead of creating a new one.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(uuidgen)"
          cert="$RUNNER_TEMP/dist.p12"
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$cert" -k "$keychain" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_pw" "$keychain" >/dev/null
          # Prepend our keychain to the search list so automatic signing finds
          # the identity regardless of who started the runner; restored on exit.
          security list-keychains -d user | tr -d '"' > "$RUNNER_TEMP/keychains.orig"
          security list-keychains -d user -s "$keychain" $(cat "$RUNNER_TEMP/keychains.orig")
          rm -f "$cert"
      - name: Build IPA
        env:
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >
          flutter build ipa
          --release
          --export-options-plist=ios/ExportOptions.plist
          --dart-define=AERODATABOX_API_KEY=$AERODATABOX_API_KEY
          --dart-define=MAPBOX_API_KEY=$MAPBOX_API_KEY
          --dart-define=UNSPLASH_API_KEY=$UNSPLASH_API_KEY
          --dart-define=OPENAI_API_KEY=$OPENAI_API_KEY
      - name: Verify signing (debug)
        run: |
          # Check the exported IPA — NOT the .xcarchive, which is always
          # Development-signed during archiving and only re-signed with the
          # distribution cert at export. The IPA is what testers install.
          ipa=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)
          echo "ipa: ${ipa:-NONE}"; test -n "$ipa"
          work=$(mktemp -d); unzip -q "$ipa" -d "$work"
          app=$(ls -d "$work"/Payload/*.app | head -1)
          echo "--- codesign authority (exported IPA) ---"
          codesign -dvvv "$app" 2>&1 | grep -Ei 'Authority=|TeamIdentifier' | head
          auth=$(codesign -dvvv "$app" 2>&1 | grep -m1 'Authority=' | sed 's/Authority=//')
          security cms -D -i "$app/embedded.mobileprovision" 2>/dev/null > /tmp/prof.plist
          echo -n "profile: "; /usr/libexec/PlistBuddy -c 'Print :Name' /tmp/prof.plist 2>/dev/null
          echo -n "get-task-allow: "; /usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' /tmp/prof.plist 2>/dev/null
          rm -rf "$work"
          case "$auth" in
            *Distribution*) echo "✅ distribution-signed: $auth" ;;
            *) echo "::error::IPA NOT distribution-signed ($auth) — testers cannot install"; exit 1 ;;
          esac
      - name: Upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: bundle exec fastlane beta
      - name: Remove signing keychain
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/keychains.orig" ] && security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.orig") || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
